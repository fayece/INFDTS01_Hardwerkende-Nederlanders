spring.application.name=hr-cms

spring.datasource.url=${DB_URL}
spring.datasource.username=cms_app
spring.datasource.password=${CMS_APP_PASSWORD}

spring.flyway.user=cms_flyway
spring.flyway.password=${CMS_FLYWAY_PASSWORD}

spring.flyway.placeholders.cms-app-password=${CMS_APP_PASSWORD}
spring.flyway.placeholders.cms-flyway-password=${CMS_FLYWAY_PASSWORD}
spring.flyway.placeholders.cms-backup-password=${CMS_BACKUP_PASSWORD}
spring.flyway.placeholders.cms-moderator-password=${CMS_MODERATOR_PASSWORD}
spring.flyway.placeholders.cms-superuser-password=${CMS_SUPERUSER_PASSWORD}

spring.mongodb.uri=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DATABASE}?authSource=admin
spring.mongodb.database=${MONGO_DATABASE}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

spring.neo4j.uri=${NEO4J_AUTH}
spring.neo4j.authentication.username=${SPRING_NEO4J_AUTHENTICATION_USERNAME}
spring.neo4j.authentication.password=${SPRING_NEO4J_AUTHENTICATION_PASSWORD}
