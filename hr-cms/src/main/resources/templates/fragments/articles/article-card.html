<!--A clickable thumbnail for articles-->
<a th:fragment="article_card(article, url)" class="article_card" th:href="@{${url} + *{article.id}}">
    <span th:replace="~{fragments/users/username :: username(
    name = ${article.firstAuthor.username}
    )}"></span>
    <span th:text="${article.title}" class ="article-card--title">The title of the article is placed right here!</span>
    <span th:insert="~{fragments/articles/engagement :: engagement(views=${article.viewCount}, comments=${article.commentCount})}"></span>
</a>
