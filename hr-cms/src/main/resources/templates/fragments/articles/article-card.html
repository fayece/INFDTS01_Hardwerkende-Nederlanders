<!--A clickalbe thumbnail for articles-->
<button th:fragment="article_card(article)" class="article_card">
    <span th:replace="~{fragments/users/username :: username}"></span>
    <span th:text="${article}">The title of the article is placed right here!</span>

    <link rel="stylesheet" type="text/css" th:href="@{/css/fragments/articles/article-card.css}"/>
</button>
