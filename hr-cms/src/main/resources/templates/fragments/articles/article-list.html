

<!--Dynamic list of article cards-->

<ul th:fragment="article-list(articles)" class="article-list">
    <li
            th:each="article: ${articles}"
            th:insert="~{fragments/articles/article-card :: article_card(article=${article})}"
    ></li>
</ul>
<link rel="stylesheet" type="text/css" th:href="@{/css/fragments/articles/article-list.css}" />
