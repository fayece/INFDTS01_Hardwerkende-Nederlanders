<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <title>Login</title>
        <link rel="stylesheet"
              th:each="cssRef : ${@cssDiscoveryService.getAllCssPaths()}"
              th:href="${cssRef}">
    </head>

    <body>
        <div></div>
        <main class="standard-page-layout">
            <h1>Login</h1>
            <p th:if="${error}" style="color:red;">
                Invalid username or password
            </p>

            <form th:action="@{/login}" method="post">
                <div>
                    <label>Username:
                        <input type="text" name="username"/>
                    </label>
                </div>

                <div>
                    <label>Password:
                        <input type="password" name="password"/>
                    </label>
                </div>

                <button type="submit">Login</button>
            </form>
        </main>
        <footer th:replace="~{fragments/app-wide/footer :: footer}"></footer>
    </body>
</html>
