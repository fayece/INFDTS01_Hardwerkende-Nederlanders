<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <title>New Article</title>
        <link rel="stylesheet"
              th:each="cssRef : ${@cssDiscoveryService.getAllCssPaths()}"
              th:href="${cssRef}">
        <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
        <script th:src = "@{/js/pages/article-editor-page.js}" defer></script>
        <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
    </head>

    <body>
        <div th:insert="~{fragments/app-wide/navbar :: navbar}" class="navbar"></div>
        <main class="standard-page-layout">
            <a th:href="@{/article/editor}">New Article</a>
            <div th:replace="~{fragments/articles/article-list :: article-list(articles=${articles}, url='/article/editor/')}"></div>
            <div th:replace="~{fragments/app-wide/pagination-navigator :: pagination-navigator(${currentPage}, ${articles.size() >= 20})}"></div>
        </main>
        <footer th:replace="~{fragments/app-wide/footer :: footer}"></footer>
    </body>
</html>
