<head>
    <title>Spotlight!</title>
    <link rel="stylesheet" th:href="${cssRef}" th:each="cssRef: ${@cssDiscoveryService.getAllCssPaths()}">

    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <script th:src = "@{/javascript/pages/article-editor-page.js}" defer></script>
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
</head>
<body>
<div th:insert="~{fragments/app-wide/navbar :: navbar}" class="navbar"></div>
<main class="standard-page-layout">
    <section class="content-section">

        <a th:href="@{articles-editor-overview}">To Overview</a>

        <form
            role="form"
            method="post"
            th:action="@{/save-draft-article}"
            th:object="${articleForm}"
            onsubmit="editorIntoTextContent()">

            <div>
                <div>
                    <span>publication status:</span><span th:text="${publicationStatus}"></span>
                    <button type="submit" name="publicationStatus" value="DRAFT">save as draft</button>
                    <button type="submit" name="publicationStatus" value="PUBLISHED">save and publish</button>
                </div>
            </div>

            <label>title<input type="text" th:field="*{title}"></label>
            <label>categories
                <select>
                    <option value="category">category</option>
                </select>
            </label>

            <div id="editor"></div>
            <textarea th:field="*{textContent}" id="text-content" hidden></textarea>
        </form>
    </section>

</main>
<footer th:replace="~{fragments/app-wide/footer :: footer}"></footer>
-

</body>
