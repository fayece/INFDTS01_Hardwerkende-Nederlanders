name: "hard-work"

services:
  server:
    container_name: hard-work-server
    env_file: ".env"
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    image: hr-cms-server
    ports:
      - "6031:${SERVER_PORT}"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 500mb
    cpus: 1

  db:
    image: postgres:18.2-trixie
    container_name: hard-work-postgres
    env_file: ".env"
    restart: always
    environment:
      POSTGRES_USER : ${POSTGRES_USER}
      POSTGRES_PASSWORD : ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DATABASE} -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6032:5432" # Currently exposed. Should be removed for a production environment.
    mem_limit: 2g
    cpus: 1

volumes:
  pgdata:
